<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>작은성공</title>
<meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1D20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="작은성공">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:oklch(0.976 0.001 286);--surface:oklch(1 0 0);--surface-sheet:oklch(1 0 0);
  --text:oklch(0 0 0 / 0.85);--text2:oklch(0 0 0 / 0.60);--text3:oklch(0 0 0 / 0.40);--text-dis:oklch(0 0 0 / 0.30);
  --border:oklch(0 0 0 / 0.08);--border-heavy:oklch(0 0 0 / 0.15);--border-heavier:oklch(0 0 0 / 0.40);
  --fill-lighter:oklch(0 0 0 / 0.03);--fill-light:oklch(0 0 0 / 0.05);--fill:oklch(0 0 0 / 0.08);--fill-heavy:oklch(0 0 0 / 0.15);
  --action:oklch(0.554 0.214 280);--action-hover:oklch(0.511 0.228 278);--action-text:oklch(0.554 0.214 280);--on-action:oklch(1 0 0);
  --action-10:oklch(0.554 0.214 280 / 0.10);--action-20:oklch(0.554 0.214 280 / 0.20);--action-30:oklch(0.554 0.214 280 / 0.30);--action-45:oklch(0.615 0.211 277 / 0.45);
  --action-ink:oklch(0.476 0.203 280);
  --success:oklch(0.652 0.168 150);--success-ink:oklch(0.562 0.100 160);--success-10:oklch(0.652 0.168 150 / 0.10);
  --grad-a:oklch(0.652 0.168 150);--grad-b:oklch(0.732 0.157 150);
  --critical:oklch(0.541 0.166 21);--critical-10:oklch(0.634 0.177 20 / 0.10);--critical-15:oklch(0.634 0.177 20 / 0.15);
  --warning:oklch(0.698 0.156 55);
  --switch-off:oklch(0 0 0 / 0.30);
  --toast-bg:oklch(0 0 0 / 0.85);--toast-text:oklch(1 0 0);--toast-text2:oklch(1 0 0 / 0.80);--toast-icon:oklch(0.732 0.157 150);--toast-link:oklch(0.714 0.140 268);
  --dim:oklch(0 0 0 / 0.40);
  --ev-1:0 0 0 1px oklch(0 0 0 / 0.08),0 1px 2px 0 oklch(0 0 0 / 0.05);
  --ev-2:inset 0 0 2px 0 oklch(1 0 0 / 0.12),0 0 0 1px oklch(0 0 0 / 0.05),0 2px 6px 0 oklch(0 0 0 / 0.08);
  --ev-3:inset 0 0 2px 0 oklch(1 0 0 / 0.12),0 0 0 1px oklch(0 0 0 / 0.05),0 4px 12px 0 oklch(0 0 0 / 0.15);
  --ev-4:inset 0 0 2px 0 oklch(1 0 0 / 0.12),0 0 0 1px oklch(0 0 0 / 0.05),0 8px 24px 0 oklch(0 0 0 / 0.22);
  --ease:cubic-bezier(0.3,0,0,1);
  --font:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:oklch(0.232 0.006 286);--surface:oklch(0.261 0.004 286);--surface-sheet:oklch(0.283 0.007 286);
  --text:oklch(1 0 0 / 0.80);--text2:oklch(1 0 0 / 0.60);--text3:oklch(1 0 0 / 0.40);--text-dis:oklch(1 0 0 / 0.30);
  --border:oklch(1 0 0 / 0.12);--border-heavy:oklch(1 0 0 / 0.20);--border-heavier:oklch(1 0 0 / 0.40);
  --fill-lighter:oklch(1 0 0 / 0.05);--fill-light:oklch(1 0 0 / 0.08);--fill:oklch(1 0 0 / 0.12);--fill-heavy:oklch(1 0 0 / 0.20);
  --action:oklch(0.665 0.181 280);--action-hover:oklch(0.722 0.148 281);--action-text:oklch(0.665 0.181 280);--on-action:oklch(0.232 0.006 286);
  --action-10:oklch(0.615 0.211 277 / 0.18);--action-20:oklch(0.615 0.211 277 / 0.30);--action-30:oklch(0.615 0.211 277 / 0.45);--action-45:oklch(0.615 0.211 277 / 0.60);
  --action-ink:oklch(0.722 0.148 281);
  --success:oklch(0.732 0.157 150);--success-ink:oklch(0.732 0.157 150);--success-10:oklch(0.724 0.162 150 / 0.18);
  --critical:oklch(0.690 0.172 23);--critical-10:oklch(0.677 0.180 23 / 0.18);--critical-15:oklch(0.677 0.180 23 / 0.30);
  --switch-off:oklch(1 0 0 / 0.20);
  --toast-bg:oklch(1 0 0);--toast-text:oklch(0 0 0 / 0.85);--toast-text2:oklch(0 0 0 / 0.60);--toast-icon:oklch(0.652 0.168 150);--toast-link:oklch(0.554 0.214 280);
  --dim:oklch(0 0 0 / 0.60);
  --ev-1:0 0 0 1px oklch(1 0 0 / 0.12),0 1px 2px 0 oklch(0 0 0 / 0.08);
  --ev-2:inset 0 0 2px 0 oklch(1 0 0 / 0.08),0 0 0 1px oklch(1 0 0 / 0.08),0 2px 6px 0 oklch(0 0 0 / 0.15);
  --ev-3:inset 0 0 2px 0 oklch(1 0 0 / 0.08),0 0 0 1px oklch(1 0 0 / 0.08),0 4px 12px 0 oklch(0 0 0 / 0.20);
  --ev-4:inset 0 0 2px 0 oklch(1 0 0 / 0.08),0 0 0 1px oklch(1 0 0 / 0.08),0 8px 24px 0 oklch(0 0 0 / 0.40);
}}
[data-cat=body]{--cat-bg:oklch(0.652 0.168 150 / 0.20);--cat-soft:oklch(0.652 0.168 150 / 0.10);--cat-icon:oklch(0.562 0.100 160)}
[data-cat=breath]{--cat-bg:oklch(0.643 0.150 248 / 0.20);--cat-soft:oklch(0.643 0.150 248 / 0.10);--cat-icon:oklch(0.570 0.156 257)}
[data-cat=sense]{--cat-bg:oklch(0.690 0.118 191 / 0.20);--cat-soft:oklch(0.690 0.118 191 / 0.10);--cat-icon:oklch(0.589 0.099 201)}
[data-cat=tidy]{--cat-bg:oklch(0.698 0.156 55 / 0.20);--cat-soft:oklch(0.698 0.156 55 / 0.10);--cat-icon:oklch(0.600 0.146 54)}
[data-cat=write]{--cat-bg:oklch(0.591 0.208 297 / 0.20);--cat-soft:oklch(0.591 0.208 297 / 0.10);--cat-icon:oklch(0.467 0.191 296)}
@media (prefers-color-scheme:dark){
[data-cat=body]{--cat-bg:oklch(0.724 0.162 150 / 0.30);--cat-soft:oklch(0.724 0.162 150 / 0.18);--cat-icon:oklch(0.732 0.157 150)}
[data-cat=breath]{--cat-bg:oklch(0.724 0.125 245 / 0.30);--cat-soft:oklch(0.724 0.125 245 / 0.18);--cat-icon:oklch(0.724 0.125 245)}
[data-cat=sense]{--cat-bg:oklch(0.787 0.123 186 / 0.30);--cat-soft:oklch(0.787 0.123 186 / 0.18);--cat-icon:oklch(0.787 0.123 186)}
[data-cat=tidy]{--cat-bg:oklch(0.764 0.148 58 / 0.30);--cat-soft:oklch(0.764 0.148 58 / 0.18);--cat-icon:oklch(0.764 0.148 58)}
[data-cat=write]{--cat-bg:oklch(0.670 0.205 299 / 0.30);--cat-soft:oklch(0.670 0.205 299 / 0.18);--cat-icon:oklch(0.670 0.205 299)}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);letter-spacing:-0.1px;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button,input,a{font:inherit;letter-spacing:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:transparent;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--action);outline-offset:2px}
h1,h2,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;position:relative;overflow:hidden}
main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 24px) 16px 32px}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}.g32{gap:32px}
.t-title{font-size:24px;line-height:32px;font-weight:700;letter-spacing:-0.4px}
.t-h2{font-size:18px;line-height:24px;font-weight:700}
.t-body{font-size:15px;line-height:22px}
.t-sub{font-size:14px;line-height:20px;color:var(--text2)}
.t-cap{font-size:13px;line-height:18px;color:var(--text2)}
.t-num{font-variant-numeric:tabular-nums}
.big{font-size:48px;line-height:56px;font-weight:700;letter-spacing:-0.4px;font-variant-numeric:tabular-nums}
.label{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.label.action{background:var(--action-10);color:var(--action-ink)}
.label.neutral{background:var(--fill-light);color:var(--text2)}
.label.cat{background:var(--cat-soft);color:var(--text)}
.label.cat .i{color:var(--cat-icon)}
.card{background:var(--surface);border-radius:16px;box-shadow:var(--ev-2);border:1px solid transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border-radius:8px;font-size:16px;font-weight:700;transition:background-color 150ms var(--ease),transform 150ms var(--ease);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(0.97)}
.btn.lg{height:56px;font-size:17px}
.btn.sm{height:36px;padding:0 12px;font-size:14px}
.btn.primary{background:var(--action);color:var(--on-action)}
.btn.secondary{background:var(--surface);color:var(--text);box-shadow:var(--ev-1)}
.btn.tertiary{background:var(--fill-light);color:var(--text)}
.btn.ghost{background:transparent;color:var(--text2);font-weight:400;height:44px}
.btn.icon-l{padding-inline-start:18px}
.btn.icon-r{padding-inline-end:18px}
.btn.full{width:100%}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text)}
@media (hover:hover){.btn.primary:hover{background:var(--action-hover)}.btn.secondary:hover,.btn.tertiary:hover,.btn.ghost:hover,.iconbtn:hover{background:var(--fill-light)}}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--fill-light)}
.seg button{height:40px;border-radius:8px;font-size:15px;color:var(--text2);transition:background-color 150ms var(--ease)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--ev-1)}
.switch{width:64px;height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.switch>span{display:inline-flex;width:52px;height:32px;padding:3px;border-radius:999px;background:var(--switch-off);transition:background-color 150ms var(--ease)}
.switch>span>span{width:26px;height:26px;border-radius:999px;background:#fff;box-shadow:0 1px 2px oklch(0 0 0 / 0.2);transition:transform 150ms var(--ease)}
.switch[aria-checked=true]>span{background:var(--success)}
.switch[aria-checked=true]>span>span{transform:translateX(20px)}
.bar{height:8px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar>div{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));transition:width 1s linear}
.list{background:var(--surface);border-radius:16px;box-shadow:var(--ev-2);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px}
.li+.li{border-top:1px solid var(--border)}
.tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:12px;background:var(--cat-soft);color:var(--cat-icon)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--action-20);text-align:left;width:100%}
.banner .i{color:var(--action-ink)}
.dot{width:8px;height:8px;border-radius:999px;background:var(--action);flex:none}
/* nav */
nav.tabs{flex:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 8px calc(var(--sab) + 4px);background:var(--surface);box-shadow:inset 0 1px 0 var(--border)}
nav.tabs button{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text3)}
nav.tabs button[aria-current=page]{color:var(--action-text);font-weight:700}
/* deck */
.deck{position:relative;height:300px}
.deck .back{position:absolute;height:252px;border-radius:20px}
.deck .b1{top:0;left:32px;right:32px;background:var(--action-20);transform:rotate(-4deg)}
.deck .b2{top:10px;left:16px;right:16px;background:var(--action-30);transform:rotate(3deg)}
.deck .top{position:absolute;top:20px;left:0;right:0;height:260px;border-radius:20px;background:var(--action);color:var(--on-action);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:24px;text-align:left;box-shadow:var(--ev-3);transition:transform 200ms var(--ease)}
.deck .top:active{transform:scale(0.98)}
.deck .ico{display:inline-flex;width:56px;height:56px;border-radius:999px;background:oklch(1 0 0 / 0.16);align-items:center;justify-content:center}
.deck.shuffling .b1{animation:shuffleL 700ms cubic-bezier(.45,0,.25,1)}
.deck.shuffling .b2{animation:shuffleR 700ms cubic-bezier(.45,0,.25,1)}
.deck.shuffling .top{animation:lift 700ms cubic-bezier(.45,0,.25,1) forwards}
/* big card */
.flipwrap{perspective:1400px}
.flip{position:relative;transform-style:preserve-3d}
.front{position:relative;min-height:420px;display:flex;flex-direction:column;justify-content:space-between;padding:24px;border-radius:20px;background:var(--cat-bg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.backface{position:absolute;inset:0;border-radius:20px;background:var(--action);color:oklch(1 0 0 / 0.9);display:flex;align-items:center;justify-content:center;transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:oklch(1 0 0 / 0.72);font-size:14px;font-weight:700;color:oklch(0 0 0 / 0.85)}
@media (prefers-color-scheme:dark){.pill{background:oklch(0 0 0 / 0.25);color:oklch(1 0 0 / 0.85)}}
.pill .i{color:var(--cat-icon)}
.orb{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:oklch(1 0 0 / 0.72);color:var(--cat-icon)}
@media (prefers-color-scheme:dark){.orb{background:oklch(0 0 0 / 0.25)}}
.card-title{font-size:28px;line-height:36px;font-weight:700;letter-spacing:-0.4px;text-align:center;text-wrap:balance;word-break:keep-all}
.anim-flipA{animation:flipA 680ms cubic-bezier(.2,.8,.2,1) both}
.anim-flipB{animation:flipB 680ms cubic-bezier(.2,.8,.2,1) both}
.anim-swipe{animation:swipeOut 260ms cubic-bezier(.5,0,.75,0) forwards}
.anim-pop{animation:pop 420ms cubic-bezier(.2,.8,.2,1) both}
.anim-bump{display:inline-block;transform-origin:left bottom;animation:bump 520ms cubic-bezier(.2,.8,.2,1)}
.drawck path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw 420ms 220ms ease-out forwards}
.breathe{animation:breathe 4s ease-in-out infinite}
.pulse{animation:pulse 1.6s ease-in-out infinite}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;line-height:20px;font-weight:700;color:var(--text3)}
.cal .wd.sun{color:var(--critical)}
.cal button,.cal span.cell{height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;border:1px solid transparent;transition:background-color 150ms var(--ease)}
.cal .d{font-size:14px;line-height:22px}
.cal .n{font-size:11px;line-height:16px;font-weight:700;color:var(--action-ink)}
.cal .future{color:var(--text-dis)}
.cal .today{border:2px solid var(--action)}
.cal .today .d{font-weight:700}
.cal button[aria-pressed=true]{background:var(--action)!important;color:var(--on-action)}
.cal button[aria-pressed=true] .n{color:var(--on-action)}
.lv1{background:var(--action-10)}.lv2{background:var(--action-20)}.lv3{background:var(--action-30)}.lv4{background:var(--action-45)}
.carousel{display:flex;gap:12px;margin:0 -16px;padding:2px 16px 6px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.stat{flex:none;width:240px;height:168px;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:space-between;padding:20px;border-radius:16px;background:var(--surface);box-shadow:var(--ev-2)}
.stat.hero{background:var(--action);color:var(--on-action);box-shadow:var(--ev-3)}
.stat.hero .t-sub{color:inherit;opacity:.85}
.dots{display:flex;justify-content:center;gap:6px}
.dots span{height:6px;width:6px;border-radius:999px;background:var(--fill-heavy);transition:width 150ms var(--ease),background-color 150ms var(--ease)}
.dots span.on{width:16px;background:var(--action)}
/* tabs filter */
.ftabs{display:flex;margin:0 -16px;padding:0 16px;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 -1px 0 var(--border)}
.ftabs::-webkit-scrollbar{display:none}
.ftabs button{flex:none;height:44px;padding:0 12px;font-size:15px;color:var(--text2);display:inline-flex;align-items:center;gap:4px}
.ftabs button[aria-pressed=true]{color:var(--action-text);font-weight:700;box-shadow:inset 0 -2px 0 var(--action)}
.ftabs .c{font-size:13px;font-variant-numeric:tabular-nums}
/* overlays */
.overlay{position:absolute;inset:0;z-index:1000;display:flex;flex-direction:column}
.overlay .dim{position:absolute;inset:0;background:var(--dim);animation:fadeIn 200ms ease-out both}
.sheet{position:relative;margin-top:auto;max-height:85%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface-sheet);border-radius:20px 20px 0 0;padding:8px 16px calc(var(--sab) + 24px);display:flex;flex-direction:column;gap:20px;box-shadow:var(--ev-4);animation:sheetUp 280ms cubic-bezier(.2,.8,.2,1) both}
.handle{align-self:center;width:40px;height:4px;border-radius:999px;background:var(--fill-heavy)}
.modal-wrap{position:absolute;inset:0;z-index:1100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{position:relative;width:100%;max-width:400px;background:var(--surface-sheet);border-radius:20px;padding:24px 20px 16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--ev-4)}
.field{height:48px;padding:0 14px;border-radius:8px;border:1px solid var(--border-heavier);background:var(--surface);color:var(--text);font-size:16px;width:100%}
.field[aria-invalid=true]{border-color:var(--warning);box-shadow:0 0 0 3px oklch(0.698 0.156 55 / 0.30)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:40px;padding:0 14px 0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-heavy)}
.chip .i{color:var(--cat-icon)}
.chip[aria-pressed=true]{background:var(--cat-soft);box-shadow:inset 0 0 0 2px var(--cat-icon)}
.radio{display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;border-radius:12px;font-size:16px;text-align:left;width:100%}
.radio .r{width:22px;height:22px;border-radius:999px;border:2px solid var(--border-heavier);display:inline-flex;align-items:center;justify-content:center;flex:none}
.radio[aria-checked=true]{background:var(--fill-lighter);font-weight:700}
.radio[aria-checked=true] .r{border-color:var(--success)}
.radio[aria-checked=true] .r::after{content:'';width:10px;height:10px;border-radius:999px;background:var(--success)}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:1200;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--toast-bg);color:var(--toast-text);box-shadow:var(--ev-3);animation:toastIn 2800ms cubic-bezier(.2,.8,.2,1) forwards}
.toast .i.ok{color:var(--toast-icon)}
.toast .link{flex:none;color:var(--toast-link);font-weight:700;font-size:14px;height:32px;padding:0 4px}

      '<h1 class="t-title" style="margin-top:4px">' + esc(a.name) + ' 열기 전에</h1><p class="t-body" style="color:var(--text2);word-break:keep-all">' + (v ? v.total + ' 중 ' + v.kept + '를 지켰어요. ' : '') + '대신 이거 하나 해볼래요?</p></div>' +
      (v ? '<div class="bar" style="height:6px"><div data-sess="bar" style="width:' + v.pct + '%"></div></div>' : '') +
      bigCard(card, U.anim) +
      '<div class="col g8" style="margin-top:auto"><button class="btn lg primary" data-a="iStart">카드 하고 열기</button><div class="row g12"><button class="btn secondary" style="flex:1" data-a="iReroll">다른 카드 · ' + U.iRerolls + '회</button><button class="btn secondary" style="flex:1" data-a="iResist">닫고 돌아가기</button></div><p class="t-sub" aria-live="polite" style="text-align:center;min-height:20px">' + esc(U.iMsg || '') + '</p></div></div>';
  } else if (U.iStage === 'run') {
    h += timerBlock(card, ['iComplete', '완료하기'], 'iBack');
  } else {
    var opened = U.iStage === 'done';
    h += '<div class="col" style="flex:1"><div class="col g8" style="align-items:center;text-align:center;padding-top:72px" data-cat="' + (opened ? card.c : 'body') + '"><span class="orb anim-pop" style="width:104px;height:104px;background:var(--cat-bg);margin-bottom:16px">' + ic('check', 48, 2.5, 'drawck') + '</span><h1 class="t-title" style="font-size:28px;line-height:36px">' + (opened ? '작은 성공 +1' : '잘 참았어요') + '</h1><p class="t-body" style="color:var(--text2);word-break:keep-all">' + (opened ? '이제 ' + esc(a.name) + '을 열어도 좋아요.' : '앱을 닫은 것도 작은 성공이에요. 하던 일로 돌아가요.') + '</p>' + (v ? '<span class="label action" style="margin-top:8px">잠금 <span data-sess="short">' + v.short + '</span> 남음</span>' : '') + '</div>' +
      '<div class="col g12" style="margin-top:auto">' + (opened && a.scheme ? '<a class="btn lg primary icon-r" href="' + a.scheme + '">' + esc(a.name) + ' 열기' + ic('ext', 18, 2.5) + '</a>' : '') + '<button class="btn ' + (opened && a.scheme ? 'secondary' : 'lg primary') + '" data-a="iHome">작은성공 홈으로</button></div></div>';
  }
  return h + '</main>';
}
function vNav() {
  var t = U.tab;
  function b(k, icon, label) { var on = t === k; return '<button ' + (on ? 'aria-current="page"' : '') + ' data-a="tab" data-v="' + k + '">' + ic(on ? icon + 'F' : icon, 24, 1.5) + label + '</button>'; }
  return '<nav class="tabs" aria-label="주요 메뉴">' + b('home', 'home', '홈') + b('rec', 'cal', '기록') + b('deck', 'layers', '내 덱') + b('lock', 'lock', '잠금') + '</nav>';
}
function vSheet() {
  if (!U.sheet) return '';
  var h = '<div class="overlay"><div class="dim" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st"><span class="handle" aria-hidden="true"></span>';
  if (U.sheet === 'add') {
    var f = U.form;
    h += '<div class="row" style="justify-content:space-between"><h2 id="st" class="t-h2" style="font-size:22px;line-height:28px">카드 추가</h2><button class="iconbtn" style="margin-right:-8px" aria-label="닫기" data-a="closeSheet">' + ic('x', 20, 1.8) + '</button></div>' +
      '<div class="col g8"><label for="nt" style="font-size:14px;font-weight:700">카드 이름</label><input id="nt" class="field" type="text" maxlength="40" autocomplete="off" placeholder="턱걸이봉에 30초 매달리기" value="' + esc(f.t) + '" aria-invalid="' + f.err + '" aria-describedby="nh"><p id="nh" class="t-cap" aria-live="polite" style="color:' + (f.err ? 'var(--warning)' : 'var(--text2)') + '">' + (f.err ? '카드 이름을 적어주세요' : '한 카드에는 행동 하나만 적어요') + '</p></div>' +
      '<div class="col g8"><p id="cl" style="font-size:14px;font-weight:700">카테고리</p><div class="chips" role="group" aria-labelledby="cl">' + CAT_KEYS.map(function (k) { return '<button class="chip" data-cat="' + k + '" aria-pressed="' + (f.c === k) + '" data-a="fCat" data-v="' + k + '">' + ic(k, 16, 2) + CATS[k] + '</button>'; }).join('') + '</div></div>' +
      '<div class="col g8"><p id="dl" style="font-size:14px;font-weight:700">걸리는 시간</p><div class="seg" role="group" aria-labelledby="dl" style="grid-template-columns:repeat(4,minmax(0,1fr))">' + DURS.map(function (d) { return '<button aria-pressed="' + (f.d === d) + '" data-a="fDur" data-v="' + d + '">' + d + '</button>'; }).join('') + '</div></div>' +
      '<div class="col g8"><p id="pll" style="font-size:14px;font-weight:700">할 수 있는 곳</p><div class="seg" role="group" aria-labelledby="pll" style="grid-template-columns:repeat(3,minmax(0,1fr))">' + ['all', 'home', 'out'].map(function (k) { return '<button aria-pressed="' + (f.p === k) + '" data-a="fPlace" data-v="' + k + '">' + PLACE[k] + '</button>'; }).join('') + '</div></div>' +
      '<button class="btn primary full" data-a="saveCard">추가하기</button>';
  } else {
    h += '<div class="col g4"><h2 id="st" class="t-h2" style="font-size:22px;line-height:28px">잠금 시간</h2><p class="t-sub">이 시간 동안 흐름을 지켜요</p></div><div class="col g4" role="radiogroup" aria-labelledby="st">' +
      LENS.map(function (m) { return '<button class="radio" role="radio" aria-checked="' + (U.lenPick === m) + '" data-a="lenPick" data-v="' + m + '"><span class="r"></span><span style="flex:1">' + lenText(m) + '</span>' + (m === 60 ? '<span class="label action" style="height:24px;font-size:12px">추천</span>' : '') + '</button>'; }).join('') +
      '</div><button class="btn primary full" data-a="applyLen">적용하기</button>';
  }
  return h + '</div></div>';
}
function vModal() {
  if (!U.modal) return '';
  var v = sessView(); if (!v) { U.modal = null; return ''; }
  return '<div class="overlay" style="z-index:1100"><div class="dim"></div><div class="modal-wrap"><div class="modal anim-pop" role="dialog" aria-modal="true" aria-labelledby="mt" aria-describedby="mb">' +
    '<span class="orb breathe" style="width:56px;height:56px;background:var(--action-10);color:var(--action-text)">' + ic('lock', 26, 2) + '</span>' +
    '<div class="col g6"><h2 id="mt" class="t-h2" style="font-size:22px;line-height:28px">잠금이 <span data-sess="short">' + v.short + '</span> 남았어요</h2><p id="mb" class="t-body" style="color:var(--text2);word-break:keep-all">' + v.kept + ' 동안 잘 지켜왔어요. 풀기 전에 카드 한 장으로 숨을 돌려볼까요?</p></div>' +
    '<div class="col g6"><div class="bar"><div data-sess="bar" style="width:' + v.pct + '%"></div></div><div class="row t-cap" style="justify-content:space-between"><span>' + v.kept + ' 지킴</span><span>목표 ' + v.total + '</span></div></div>' +
    '<div class="col g8" style="padding-top:4px"><button class="btn primary" data-a="draw">카드 한 장 뽑기</button><button class="btn secondary" data-a="closeModal">계속 잠그기</button>' +
    '<button class="hold" data-hold="1" aria-describedby="hh"><span class="fillh" style="width:0%"></span><span>2초 동안 길게 눌러서 풀기</span></button><span id="hh" class="sr">버튼을 2초 동안 누르고 있으면 잠금이 풀려요</span></div></div></div></div>';
}
function vToast() {
  var t = U.toast; if (!t) return '';
  return '<div class="toast" role="status">' + ic('check', 22, 2.2, 'ok') + '<span class="col" style="flex:1;min-width:0"><span style="font-size:15px;line-height:20px;font-weight:700">' + esc(t.label) + '</span>' + (t.desc ? '<span style="font-size:13px;line-height:18px;color:var(--toast-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(t.desc) + '</span>' : '') + '</span>' + (t.link ? (t.link.a ? '<button class="link" data-a="' + t.link.a + '">' + esc(t.link.label) + '</button>' : '<span class="link" style="display:inline-flex;align-items:center">' + esc(t.link.label) + '</span>') : '') + '</div>';
}

var lastKey = '';
function render() {
  var app = document.getElementById('app');
  var main = app.querySelector('main'), key = U.intercept ? 'i' : U.tab, scroll = main && key === lastKey ? main.scrollTop : 0;
  var body;
  if (U.intercept) body = vIntercept();
  else {
    var inner = U.tab === 'home' ? (U.stage === 'card' ? vCard() : U.stage === 'run' ? timerBlock(findCard(U.cardId), ['complete', '완료하기'], 'quit') : U.stage === 'done' ? vDone() : vHome()) : U.tab === 'rec' ? vRec() : U.tab === 'deck' ? vDeck() : vLock();
    body = '<main>' + inner + '</main>' + vNav();
  }
  app.innerHTML = body + vSheet() + vModal() + vToast();
  var nm = app.querySelector('main'); if (nm) nm.scrollTop = scroll;
  lastKey = key; U.anim = ''; U.countBump = false;
  var car = document.getElementById('car');
  if (car) { car.scrollLeft = U.carIdx * 252; car.addEventListener('scroll', onCar, { passive: true }); }
}
function onCar(e) {
  var i = Math.max(0, Math.min(4, Math.round(e.currentTarget.scrollLeft / 252)));
  if (i !== U.carIdx) { U.carIdx = i; document.querySelectorAll('.dots span').forEach(function (s, j) { s.className = j === i ? 'on' : ''; }); }
}

/* ---------- events ---------- */
var A = {
  tab: function (v) { U.tab = v; if (v !== 'home' && U.stage === 'shuffle') U.stage = 'idle'; },
  home: function () { stopCardTimer(); U.stage = 'idle'; U.cardId = null; U.msg = ''; },
  place: function (v) { S.place = v; save(); },
  draw: function () { draw(); return false; },
  reroll: function () { reroll(false); return false; },
  start: function () { var c = findCard(U.cardId); U.stage = 'run'; startCardTimer(c, tickTimerDom); },
  complete: function () { stopCardTimer(); var c = findCard(U.cardId); logWin(c, 'home'); U.stage = 'done'; U.countBump = true; toast('작은 성공을 완료했어요', c.t, { label: '기록 보기', a: 'goRec' }); },
  goRec: function () { U.toast = null; U.tab = 'rec'; U.stage = 'idle'; U.selKey = dayKey(new Date()); U.viewY = new Date().getFullYear(); U.viewM = new Date().getMonth(); },
  quit: function () { stopCardTimer(); U.stage = 'idle'; U.cardId = null; },
  month: function (v) { var d = new Date(U.viewY, U.viewM + Number(v), 1); U.viewY = d.getFullYear(); U.viewM = d.getMonth(); U.selKey = null; U.carIdx = 0; },
  day: function (v) { U.selKey = v; },
  filter: function (v) { U.deckFilter = v; },
  openAdd: function () { U.form = { t: '', c: 'body', d: '1분', p: 'all', err: false }; U.sheet = 'add'; },
  closeSheet: function () { U.sheet = null; },
  fCat: function (v) { U.form.c = v; }, fDur: function (v) { U.form.d = v; }, fPlace: function (v) { U.form.p = v; },
  saveCard: function () {
    var t = (document.getElementById('nt').value || '').trim(); U.form.t = t;
    if (!t) { U.form.err = true; render(); document.getElementById('nt').focus(); return false; }
    S.custom.unshift({ id: 'c' + Date.now(), t: t, c: U.form.c, d: U.form.d, p: U.form.p, x: true }); save();
    U.sheet = null; U.deckFilter = 'all'; toast('덱에 카드를 추가했어요', t);
  },
  delCard: function (v) { S.custom = S.custom.filter(function (c) { return c.id !== v; }); save(); toast('카드를 지웠어요'); },
  hideCard: function (v) { if (deck().length <= 1) return; S.hidden.push(v); save(); },
  restore: function () { S.hidden = []; save(); },
  openLen: function () { U.lenPick = S.lockLen; U.sheet = 'len'; },
  lenPick: function (v) { U.lenPick = Number(v); },
  applyLen: function () { S.lockLen = U.lenPick; save(); U.sheet = null; },
  startLock: function () { var now = Date.now(); S.session = { start: now, end: now + S.lockLen * 60000 }; save(); startLockTicker(); toast('잠금을 시작했어요', lenText(S.lockLen) + ' 동안 흐름을 지켜봐요'); },
  askEnd: function () { U.modal = 'end'; U.hold = 0; },
  closeModal: function () { holdStop(); U.modal = null; U.hold = 0; },
  copy: function (v) {
    var done = function () { toast('링크를 복사했어요', '단축어의 URL 열기에 붙여 넣으세요'); render(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, function () { prompt('이 링크를 복사하세요', v); });
    else prompt('이 링크를 복사하세요', v);
    return false;
  },
  rerollLimit: function (v) { S.rerollLimit = Number(v); save(); },
  iStart: function () { var c = findCard(U.iCard); U.iStage = 'run'; startCardTimer(c, tickTimerDom); },
  iReroll: function () { reroll(true); return false; },
  iResist: function () { logWin(RESIST, 'intercept'); U.iStage = 'resist'; },
  iBack: function () { stopCardTimer(); U.iStage = 'shield'; U.anim = nextFlip(); },
  iComplete: function () { stopCardTimer(); logWin(findCard(U.iCard), 'intercept'); U.iStage = 'done'; },
  iHome: function () { U.intercept = null; history.replaceState(null, '', location.pathname); U.tab = 'home'; U.stage = 'idle'; }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return;
  var fn = A[el.getAttribute('data-a')]; if (!fn) return;
  var r = fn(el.getAttribute('data-v'));
  if (r !== false) render();
});
document.addEventListener('input', function (e) { if (e.target.id === 'nt') { U.form.t = e.target.value; if (U.form.err && e.target.value.trim()) { U.form.err = false; e.target.setAttribute('aria-invalid', 'false'); var nh = document.getElementById('nh'); nh.textContent = '한 카드에는 행동 하나만 적어요'; nh.style.color = 'var(--text2)'; } } });
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (U.modal) { A.closeModal(); render(); } else if (U.sheet) { U.sheet = null; render(); } }
  if (e.target.id === 'nt' && e.key === 'Enter') { e.preventDefault(); A.saveCard() !== false && render(); }
  if (e.target.closest && e.target.closest('[data-hold]') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); holdStart(); }
});
document.addEventListener('keyup', function (e) { if (e.target.closest && e.target.closest('[data-hold]')) holdCancel(); });
document.addEventListener('pointerdown', function (e) { if (e.target.closest('[data-hold]')) { e.preventDefault(); holdStart(); } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { document.addEventListener(t, function (e) { if (holdTimer && (t !== 'pointerleave' || e.target.closest && e.target.closest('[data-hold]'))) holdCancel(); }, true); });
document.addEventListener('contextmenu', function (e) { if (e.target.closest('[data-hold]')) e.preventDefault(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { if (checkSession()) render(); else if (S.session) render(); } });

/* ---------- boot ---------- */
checkSession();
if (S.session) startLockTicker();
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
